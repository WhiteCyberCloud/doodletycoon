<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imperio de Monedas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Rubik+Doodle+Shadow&display=swap">
<style>
html{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: 3D island (a giant coin) fills the stage; HUD floats over it; shop docks below on phones, right on desktop. Single night-vault look. */
:root{
  --night:#0f1f2a; --panel:#152a37; --panel-2:#1b3545; --panel-3:#22414f; --line:#28495d;
  --gold:#f2b632; --gold-hi:#ffe08a; --gold-deep:#b97a14; --gem:#7fd8ff; --gem-deep:#2d6f8f;
  --ink:#eef3f1; --muted:#8ea8b4; --mint:#5fd3a6; --coral:#ff8a6b; --violet:#b98cff;
  --f-display:"Bungee","Impact",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;cursor:crosshair;
  background:radial-gradient(120% 90% at 50% 25%,#21435a 0%,#132836 55%,var(--night) 80%)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage.frenzy{box-shadow:inset 0 0 80px rgba(255,138,107,.45)}

.hud{position:absolute;top:10px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:3}
.bank{display:flex;flex-direction:column;gap:3px;min-width:0}
.ename{font:400 12px var(--f-display);color:var(--ink);letter-spacing:.06em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.money{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:clamp(26px,7.2vw,42px);line-height:1;color:var(--gold);
  text-shadow:0 3px 0 var(--gold-deep),0 8px 20px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;transition:transform .08s}
.money.bump{transform:scale(1.08)}
.coin-ico{width:.82em;height:.82em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 50%,var(--gold-deep));
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),0 3px 0 var(--gold-deep);flex:none}
.rate{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.rate b{color:var(--mint);font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{font:800 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--coral);color:#2a0f08}
.pill.gem{background:var(--gem);color:#06283a}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.icon-btn{font:700 12px var(--f-body);color:var(--ink);background:rgba(21,42,55,.82);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer}
.icon-btn:focus-visible,.storm:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.combo{font-family:var(--f-display);font-size:18px;color:var(--coral);opacity:0;transform:scale(.8);transition:opacity .2s,transform .15s;text-shadow:0 2px 0 #7a2f20;pointer-events:none}
.combo.on{opacity:1;transform:scale(1)}
.storm{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;z-index:3;width:68px;height:68px;border-radius:50%;border:0;cursor:pointer;
  font:400 11px var(--f-display);color:#2a1800;background:conic-gradient(var(--gold) var(--p,100%),#3a5566 0);box-shadow:0 4px 0 var(--gold-deep),0 8px 20px rgba(0,0,0,.4);display:grid;place-items:center;line-height:1.1}
.storm span{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffe9a3,var(--gold));text-align:center}
.storm:disabled{cursor:default;box-shadow:none}
.storm:disabled span{background:#22414f;color:var(--muted)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:13px;color:var(--ink);background:rgba(15,31,42,.78);
  padding:7px 14px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap;z-index:2}
.pop{position:absolute;pointer-events:none;font-family:var(--f-display);font-size:18px;color:var(--gold-hi);text-shadow:0 2px 0 var(--gold-deep),0 0 12px rgba(242,182,50,.5);
  transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;white-space:nowrap;z-index:2}
.pop.gem{color:var(--gem);text-shadow:0 2px 0 var(--gem-deep);font-size:24px}
.pop.small{font-size:12px;opacity:.8}
.pop.big{font-size:30px;color:var(--coral);text-shadow:0 3px 0 #7a2f20;animation-duration:1.3s}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-250%) scale(1)}}
.ripple{position:absolute;width:10px;height:10px;border:2px solid rgba(242,182,50,.75);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:rip .35s ease-out forwards}
@keyframes rip{to{width:var(--rs,70px);height:var(--rs,70px);opacity:0}}
.fly{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 50%,var(--gold-deep));box-shadow:0 0 10px rgba(242,182,50,.7)}
.fly.gem{background:radial-gradient(circle at 35% 30%,#fff,var(--gem) 55%,var(--gem-deep));box-shadow:0 0 12px rgba(127,216,255,.8)}
.toasts{position:absolute;left:50%;top:92px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:5;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--panel-2);border:1px solid var(--gold-deep);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:600;font-size:13.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);text-align:center;animation:tin .3s ease-out}
.toast b{color:var(--gold)}
.toast.ach{border-color:var(--gem)} .toast.ach b{color:var(--gem)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

#panel{flex:0 0 auto;height:min(46%,420px);background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px 0;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.tab{position:relative;flex:1 0 auto;min-width:0;padding-inline:10px!important;font:800 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 2px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.tab .dot{position:absolute;top:5px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.toolbar{display:flex;gap:6px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--panel-2);border-radius:10px;padding:3px}
.seg button{font:700 12px var(--f-num);color:var(--muted);background:none;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1800}
.list{flex:1;overflow-y:auto;padding-block:10px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px;background:var(--panel-2);border:1px solid transparent;border-radius:12px}
.item.can{border-color:rgba(95,211,166,.4)}
.item.locked{opacity:.55}
.glyph{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:var(--night)}
.meta{min-width:0}
.meta h3{margin:0;font-size:14.5px;font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.meta h3 .lv{font:500 11.5px var(--f-num);color:var(--muted)}
.meta p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
.bar{height:4px;border-radius:2px;background:var(--panel);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.buy{font:700 12.5px var(--f-num);color:#2a1800;background:var(--gold);border:0;border-radius:10px;padding:9px 10px;min-width:82px;cursor:pointer;box-shadow:0 3px 0 var(--gold-deep);font-variant-numeric:tabular-nums;line-height:1.15}
.buy small{display:block;font-size:10px;font-weight:500;opacity:.8}
.buy.gem{background:var(--gem);box-shadow:0 3px 0 var(--gem-deep);color:#06283a}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.buy:disabled{background:#2b4757;color:#6f8b98;box-shadow:none;cursor:not-allowed}
.buy:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
h4.sub{margin:8px 0 0;font:400 13px var(--f-display);color:var(--gem);letter-spacing:.02em}
.dyn-card{background:var(--panel-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dyn-card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--gem)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border-radius:10px;padding:8px 10px;min-width:0}
.stat span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font:700 15px var(--f-num);font-variant-numeric:tabular-nums}
.wide-btn{font:800 14px var(--f-body);color:#06283a;background:var(--gem);border:0;border-radius:10px;padding:12px;cursor:pointer;box-shadow:0 3px 0 var(--gem-deep)}
.wide-btn:disabled{background:#2b4757;color:#6f8b98;box-shadow:none;cursor:not-allowed}
.wide-btn.warn{background:var(--coral);box-shadow:0 3px 0 #7a2f20;color:#2a0f08}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--panel-2);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;min-width:0}
.ach .ai{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 13px var(--f-display);background:var(--panel);color:var(--muted)}
.ach.done .ai{background:var(--gem);color:#06283a}
.ach b{display:block;font-size:12.5px} .ach span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ach:not(.done) b{color:var(--muted)}
.board{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--panel-2)}
.row.me{outline:1.5px solid var(--gold)}
.rank{font-family:var(--f-display);font-size:15px;color:var(--muted);text-align:center}
.row:nth-child(1) .rank{color:var(--gold)} .row:nth-child(2) .rank{color:#c9d6dd} .row:nth-child(3) .rank{color:#d99a6c}
.who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.who small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.score{font:700 14px var(--f-num);color:var(--gold);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;padding:14px;text-align:center;background:var(--panel-2);border-radius:10px}

#intro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:radial-gradient(80% 60% at 50% 40%,rgba(15,31,42,.35),rgba(15,31,42,.92))}
#intro h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(38px,11vw,78px);line-height:.95;color:var(--gold);
  text-shadow:0 5px 0 var(--gold-deep),0 14px 40px rgba(0,0,0,.6);text-wrap:balance}
#intro h1 em{display:block;font-style:normal;color:var(--ink);font-size:.42em;letter-spacing:.2em;text-shadow:0 3px 0 #0a151d}
#intro p{margin:0;color:var(--muted);max-width:34ch;line-height:1.5}
#play{font:400 20px var(--f-display);color:#2a1800;background:var(--gold);border:0;border-radius:14px;padding:16px 34px;cursor:pointer;box-shadow:0 5px 0 var(--gold-deep),0 14px 30px rgba(0,0,0,.4);animation:breathe 1.6s ease-in-out infinite}
#play:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@keyframes breathe{50%{transform:scale(1.05)}}
.steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.steps span{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:rgba(34,65,79,.85);padding:6px 10px;border-radius:999px}

.field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;text-align:left}
.field label{font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.txt{font:600 16px var(--f-body);color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.txt:focus{outline:none;border-color:var(--gold)}
.txt::placeholder{color:#5f7c89}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs button{font:600 12px var(--f-body);color:var(--ink);background:rgba(34,65,79,.9);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.sugs button:focus-visible{outline:2px solid var(--gold)}
#play:disabled{opacity:.5;animation:none;cursor:not-allowed}
.set-card{background:var(--panel-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.set-row{display:flex;gap:8px}
.set-row .txt{font-size:14px;padding:10px 12px}
.ghost{font:700 13px var(--f-body);color:var(--ink);background:var(--panel-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;white-space:nowrap}
.danger{font:800 13px var(--f-body);color:var(--coral);background:none;border:1.5px solid var(--coral);border-radius:10px;padding:11px;cursor:pointer}
.danger.armed{background:var(--coral);color:#2a0f08}
.ghost:focus-visible,.danger:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tabs::-webkit-scrollbar{display:none}
/* ---- casino ---- */
.casino{display:flex;flex-direction:column;gap:14px}
.marquee{position:relative;border-radius:16px;padding:22px 14px 18px;text-align:center;overflow:hidden;
  background:radial-gradient(120% 140% at 50% 0%,#6a1a38 0%,#3a0d20 55%,#22071300 100%),#22070f;box-shadow:inset 0 0 0 2px var(--gold-deep),inset 0 0 0 4px #3a0d20,inset 0 0 0 5px var(--gold),0 10px 26px rgba(0,0,0,.45)}
.marquee::before,.marquee::after{content:"";position:absolute;left:12px;right:12px;height:8px;
  background:radial-gradient(circle,#fff3c4 0 2px,#ffb020 2.6px,transparent 3.4px) 0 50%/14px 8px repeat-x;filter:drop-shadow(0 0 3px #ffb020);animation:chase .5s steps(2) infinite}
.marquee::before{top:7px} .marquee::after{bottom:7px;animation-direction:reverse}
@keyframes chase{to{background-position:14px 50%}}
.marquee .sign{margin:0;font:400 clamp(24px,7vw,32px)/1 var(--f-display);letter-spacing:.04em;
  background:linear-gradient(180deg,#fff6d0 0%,#ffd666 45%,#c9851a 55%,#ffe08a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a1630) drop-shadow(0 0 14px rgba(255,176,32,.45))}
.marquee .tag{margin:6px 0 12px;font:800 10.5px var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:#f3c8d4}
.purse{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.purse div{background:rgba(0,0,0,.28);border:1px solid rgba(242,182,50,.35);border-radius:10px;padding:8px}
.purse span{display:block;font:800 9.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#e7b9c6}
.purse b{font:700 16px var(--f-num);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.felt{position:relative;border-radius:20px;padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:hidden;
  background:radial-gradient(130% 90% at 50% 18%,#2a8f63 0%,#17603f 50%,#0c3826 100%);
  box-shadow:inset 0 0 0 3px #0a2a1d,inset 0 0 0 6px var(--gold-deep),inset 0 0 0 7px var(--gold-hi),inset 0 0 0 11px #4a2810,inset 0 0 50px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.45)}
.felt::before{content:"";position:absolute;inset:16px;border:1.5px dashed rgba(255,236,190,.22);border-radius:12px;pointer-events:none}
.plaque{position:relative;font:400 14px var(--f-display);letter-spacing:.14em;color:#3a2200;background:linear-gradient(180deg,#fff0b8,#e0a83a 60%,#c9851a);
  padding:7px 16px;border-radius:8px;box-shadow:0 3px 0 #7a4c08,0 6px 14px rgba(0,0,0,.35)}
.odds{font:600 11.5px var(--f-body);color:#d6f0e2;letter-spacing:.04em;margin-top:-4px;text-align:center}
.wheel-wrap{position:relative;width:min(270px,76vw);aspect-ratio:1;max-width:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-wrap::after{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);border:9px solid transparent;border-top:16px solid var(--gold-hi);filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.hist{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:24px}
.hist span{width:24px;height:24px;border-radius:50%;font:700 10.5px var(--f-num);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,236,190,.6)}
.hist span:first-child{animation:hin .4s ease-out;box-shadow:inset 0 0 0 2px var(--gold-hi),0 0 10px rgba(255,214,102,.6)}
.hist .red{background:#c93a2e} .hist .blk{background:#10191d} .hist .grn{background:#2f9e63}
.hist em{font:600 11px var(--f-body);color:#bfe3cf;font-style:normal;align-self:center}
@keyframes hin{from{transform:scale(0)}}
.layout{display:grid;grid-template-columns:.8fr 1fr 1fr;gap:6px;width:100%}
.cell{position:relative;min-height:58px;border:2px solid rgba(255,240,200,.65);border-radius:10px;background:rgba(0,0,0,.12);color:#fdf3d8;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:800 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;transition:transform .12s,background .15s}
.cell i{display:block;width:22px;height:22px;transform:rotate(45deg);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.cell.zero i{transform:none;border-radius:50%;width:24px;display:grid;place-items:center;font:700 12px var(--f-num);font-style:normal;color:#fff}
.cell b{font:700 11px var(--f-num);color:var(--gold-hi);letter-spacing:0}
.cell[aria-pressed="true"]{background:rgba(255,214,102,.18);border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(255,214,102,.35),0 0 18px rgba(255,214,102,.35);transform:translateY(-2px)}
.cell[aria-pressed="true"]::after{content:"";position:absolute;top:-9px;right:-7px;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle,#f2b632 0 45%,transparent 47%),repeating-conic-gradient(#fff 0 20deg,#c93a2e 20deg 45deg);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.cell:focus-visible,.chipb:focus-visible,.side:focus-visible,.spin:focus-visible{outline:2px solid #fff;outline-offset:2px}
.stake{display:flex;align-items:baseline;gap:8px;color:#d6f0e2;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.stake b{font:700 20px var(--f-num);color:#fff;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.stake small{font:500 11px var(--f-num);color:#9fcbb4;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chipb{--c:#e8e2d0;--t:#1b2a33;position:relative;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;font:400 12px var(--f-display);color:var(--t);
  background:radial-gradient(circle,var(--c) 0 50%,rgba(0,0,0,.18) 51% 53%,transparent 54%),repeating-conic-gradient(#fff 0 18deg,var(--c) 18deg 45deg);
  box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 0 0 3px rgba(0,0,0,.15);transition:transform .15s,box-shadow .15s}
.chipb.c1{--c:#e8e2d0;--t:#1b2a33} .chipb.c2{--c:#d9483b;--t:#fff} .chipb.c3{--c:#2f6fd0;--t:#fff} .chipb.c4{--c:#151515;--t:var(--gold-hi)}
.chipb.c4{background:radial-gradient(circle,#151515 0 50%,rgba(242,182,50,.6) 51% 53%,transparent 54%),repeating-conic-gradient(var(--gold) 0 18deg,#151515 18deg 45deg)}
.chipb[aria-pressed="true"]{transform:translateY(-6px) scale(1.06);box-shadow:0 10px 0 rgba(0,0,0,.25),0 0 0 3px var(--gold-hi),0 0 20px rgba(255,214,102,.6)}
.spin{position:relative;width:100%;overflow:hidden;font:400 19px var(--f-display);letter-spacing:.08em;color:#3a2200;border:0;border-radius:14px;padding:14px;cursor:pointer;
  background:linear-gradient(180deg,#fff0b8,#f2b632 55%,#d99a1e);box-shadow:0 5px 0 #7a4c08,0 10px 20px rgba(0,0,0,.35)}
.spin::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.spin.all{color:#fff;background:linear-gradient(180deg,#ff9a7d,#e0452f 60%,#a8281a);box-shadow:0 5px 0 #5a140c,0 0 22px rgba(255,90,60,.55);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 #5a140c,0 0 34px rgba(255,90,60,.85)}}
.spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #7a4c08}
.spin:disabled{background:#2a4a3c;color:#7fa391;box-shadow:none;cursor:not-allowed;animation:none}
.spin:disabled::after{display:none}
.verdict{position:absolute;left:50%;top:38%;z-index:3;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;white-space:nowrap;text-align:center;
  font:400 26px var(--f-display);padding:12px 20px;border-radius:14px;line-height:1.1}
.verdict small{display:block;font:700 14px var(--f-num);margin-top:4px}
.verdict.win{color:#3a2200;background:linear-gradient(180deg,#fff0b8,#f2b632);box-shadow:0 6px 0 #7a4c08,0 0 40px rgba(255,214,102,.8)}
.verdict.lose{color:#ffb4a3;background:rgba(20,8,6,.88);box-shadow:0 0 0 2px #a8281a}
.verdict.show{animation:vin 2.1s ease-out forwards}
@keyframes vin{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.conf{position:absolute;top:-14px;width:8px;height:13px;z-index:2;pointer-events:none;border-radius:2px;animation:fall var(--d,1.8s) cubic-bezier(.3,.2,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--x,0),110vh) rotate(var(--r,540deg))}}
.flip-stage{position:relative;width:150px;height:170px;perspective:700px}
.flipcoin{position:absolute;left:15px;bottom:28px;width:120px;height:120px;transform-style:preserve-3d}
.flipcoin .face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;transform:translateZ(6px);
  background:radial-gradient(circle at 34% 28%,#fff6d0,#f2b632 45%,#c9851a 80%,#8a5a0a);box-shadow:inset 0 0 0 5px #b97a14,inset 0 0 0 8px #ffe08a,inset 0 -6px 14px rgba(90,50,0,.45)}
.flipcoin .face.back{transform:rotateY(180deg) translateZ(6px);background:radial-gradient(circle at 34% 28%,#f0fbff,#7fd8ff 45%,#3a8fbf 80%,#1d5a7a);box-shadow:inset 0 0 0 5px #2d6f8f,inset 0 0 0 8px #d6f4ff,inset 0 -6px 14px rgba(0,30,60,.45)}
.flipcoin .face i{position:absolute;inset:16px;border-radius:50%;border:2px dashed rgba(90,50,0,.45)}
.flipcoin .face.back i{border-color:rgba(10,50,80,.45)}
.flipcoin .face span{font:400 46px var(--f-display);color:#7a4c08;text-shadow:0 1px 0 #ffe9a3,0 -1px 0 rgba(0,0,0,.25)}
.flipcoin .face.back span{color:#0b3a52;text-shadow:0 1px 0 #e6f8ff}
.flipcoin .face small{position:absolute;bottom:22px;font:800 8.5px var(--f-body);letter-spacing:.2em;color:#7a4c08}
.flipcoin .face.back small{color:#0b3a52}
.flipcoin .edge{position:absolute;inset:0;border-radius:50%;background:#9a6410;box-shadow:inset 0 0 0 2px #6e4508}
.coin-shadow{position:absolute;bottom:14px;left:50%;width:96px;height:16px;margin-left:-48px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(4px)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.side{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:12px;border:2px solid rgba(255,240,200,.55);background:rgba(0,0,0,.14);color:#fdf3d8;font:800 13px var(--f-body);cursor:pointer;letter-spacing:.04em}
.side em{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:400 11px var(--f-display);font-style:normal;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2b632 55%,#b97a14);color:#7a4c08}
.side.b em{background:radial-gradient(circle at 35% 30%,#fff,#7fd8ff 55%,#2d6f8f);color:#0b3a52}
.side[aria-pressed="true"]{border-color:var(--gold-hi);background:rgba(255,214,102,.18);box-shadow:0 0 16px rgba(255,214,102,.35)}
.streak{font:700 11.5px var(--f-body);color:#bfe3cf;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.marquee::before,.marquee::after,.spin::after,.spin.all{animation:none}}
.mk-head{background:var(--panel-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mk{background:var(--panel-2);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.mk .nm{font-weight:800;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .sub{font-size:11.5px;color:var(--muted)}
.chip{display:inline-block;font:800 9.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--panel-3);color:var(--muted);margin-left:6px;vertical-align:2px}
.chip.live{background:rgba(95,211,166,.18);color:var(--mint)}
.px{font:700 14px var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.px small{display:block;font-size:11px;font-weight:500}
.up{color:var(--mint)} .dn{color:var(--coral)}
.mk svg{grid-column:1/-1;width:100%;height:34px;display:block}
.mk .hold{grid-column:1/-1;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.mk .acts{grid-column:1/-1;display:flex;gap:8px}
.mk .acts button{flex:1}
@media (min-width:900px){
  #app{flex-direction:row}
  #panel{height:100%;width:400px;border-top:0;border-left:1px solid var(--line)}
  .tabs{padding-left:10px}
  .list{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){.pop,.ripple{animation-duration:.01s}#play{animation:none}}

/* ================= DOODLE LAYER: notebook paper, ink pen, highlighter markers ================= */
:root{
  --night:#fbf6e9; --panel:#fffdf6; --panel-2:#ffffff; --panel-3:#f3eedf; --line:#1f2a44;
  --gold:#ffd23f; --gold-hi:#ffe680; --gold-deep:#1f2a44; --gem:#7cc6f2; --gem-deep:#1f2a44;
  --ink:#1f2a44; --muted:#6b7486; --mint:#2fb37a; --coral:#ff6b5b; --violet:#a77ce8;
  --f-display:"Gochi Hand","Comic Sans MS","Chalkboard SE",cursive;
  --f-body:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  --f-num:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  --f-title:"Rubik Doodle Shadow","Gochi Hand",cursive;
  --wob:255px 15px 225px 15px/15px 225px 15px 255px;
  --wob2:15px 255px 15px 225px/225px 15px 255px 15px;
  --pen:2.5px solid var(--ink);
  color-scheme:light;
}
body{background:var(--night);color:var(--ink);font-size:16px}
#stage{background-color:#fbf6e9;background-image:
  linear-gradient(rgba(77,157,224,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(77,157,224,.16) 1px,transparent 1px);
  background-size:26px 26px;cursor:crosshair}
#stage.frenzy{box-shadow:inset 0 0 0 6px var(--coral),inset 0 0 60px rgba(255,107,91,.35)}
.ename{font:400 17px var(--f-display);color:var(--ink);opacity:1;letter-spacing:.02em}
.money{font:400 clamp(34px,9vw,52px)/1 var(--f-display);color:var(--ink);text-shadow:none;
  background:linear-gradient(transparent 55%,var(--gold) 55% 88%,transparent 88%);padding-right:6px;width:max-content;max-width:100%}
.coin-ico{background:var(--gold);border:var(--pen);box-shadow:2px 2px 0 var(--ink);width:.62em;height:.62em}
.rate{font:400 15px var(--f-body);color:var(--muted)}
.rate b{color:var(--mint)}
.pill{font:400 13px var(--f-display);letter-spacing:.02em;text-transform:none;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.pill.gem{color:var(--ink)}
.icon-btn{font:400 15px var(--f-display);color:var(--ink);background:#fff;border:var(--pen);border-radius:var(--wob2);box-shadow:2px 3px 0 var(--ink)}
.combo{font:400 24px var(--f-display);color:var(--coral);text-shadow:-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px 1.5px 0 #fff,3px 3px 0 var(--ink);transform:rotate(-4deg) scale(.8)}
.combo.on{transform:rotate(-4deg) scale(1)}
.storm{background:conic-gradient(var(--coral) var(--p,100%),#fff 0);border:var(--pen);box-shadow:3px 4px 0 var(--ink);font:400 14px var(--f-display);color:var(--ink)}
.storm span{background:var(--gold);border:2px solid var(--ink);width:52px;height:52px}
.storm:disabled span{background:#fff;color:var(--muted)}
.hint{font:400 16px var(--f-display);color:var(--ink);background:#fff;border:var(--pen);border-radius:var(--wob);box-shadow:3px 3px 0 var(--ink);transform:translateX(-50%) rotate(-1.5deg)}
.pop{font:400 24px var(--f-display);color:var(--ink);text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,3px 4px 0 var(--gold)}
.pop.gem{color:#1b6fa8;font-size:30px;text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,3px 4px 0 var(--gem)}
.pop.small{font-size:16px}
.pop.big{font-size:38px;color:var(--coral);text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,4px 5px 0 var(--ink)}
.ripple{border:2.5px dashed var(--ink)}
.fly{background:var(--gold);border:2px solid var(--ink);box-shadow:none}
.fly.gem{background:var(--gem);border:2px solid var(--ink);box-shadow:none}
.toast{font:400 17px var(--f-body);background:#fff;color:var(--ink);border:var(--pen);border-radius:var(--wob);box-shadow:4px 4px 0 var(--ink);transform:rotate(-1deg)}
.toast b{color:var(--ink);background:linear-gradient(transparent 50%,var(--gold) 50% 90%,transparent 90%)}
.toast.ach{border-color:var(--ink)} .toast.ach b{color:var(--ink);background:linear-gradient(transparent 50%,var(--gem) 50% 90%,transparent 90%)}
#panel{background:#fffdf6 repeating-linear-gradient(transparent 0 27px,rgba(77,157,224,.22) 27px 28px);border-top:var(--pen);border-left-color:var(--ink)}
@media (min-width:900px){#panel{border-left:var(--pen)}}
.tabs{border-bottom:var(--pen);background:#fffdf6}
.tab{font:400 18px var(--f-display);letter-spacing:.01em;text-transform:none;color:var(--muted);border-bottom:0;padding-block:8px 6px}
.tab[aria-selected="true"]{color:var(--ink);background:linear-gradient(transparent 58%,var(--gold) 58% 90%,transparent 90%)}
.tab .dot{background:var(--coral);border:1.5px solid var(--ink);width:9px;height:9px}
.note{font:400 16px var(--f-body);color:var(--muted);line-height:1.35}
h4.sub{font:400 22px var(--f-display);color:var(--ink);text-decoration:underline wavy var(--coral) 2px;text-underline-offset:5px}
.item{background:#fff;border:var(--pen);border-radius:var(--wob);box-shadow:3px 4px 0 var(--ink)}
.item:nth-child(even){border-radius:var(--wob2)}
.item.can{border-color:var(--ink);box-shadow:3px 4px 0 var(--mint)}
.item.locked{opacity:.55;border-style:dashed;box-shadow:none}
.glyph{border:var(--pen);border-radius:var(--wob2);color:var(--ink);font:400 24px var(--f-display);transform:rotate(-3deg)}
.meta h3{font:400 19px var(--f-display);color:var(--ink)}
.meta h3 .lv{font:400 14px var(--f-body);color:var(--muted)}
.meta p{font:400 14.5px var(--f-body);color:var(--muted)}
.bar{background:#fff;border:1.5px solid var(--ink);height:8px;border-radius:6px}
.bar i{background:var(--gold);border-right:1.5px solid var(--ink)}
.buy{font:400 17px var(--f-display);color:var(--ink);background:var(--gold);border:var(--pen);border-radius:var(--wob2);box-shadow:3px 3px 0 var(--ink)}
.buy small{font:400 12px var(--f-body)}
.buy.gem{background:var(--gem);box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.buy:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.buy:disabled{background:#f4f0e4;color:#9aa1ae;border:2.5px dashed #b6bcc8;box-shadow:none}
.seg{background:#fff;border:var(--pen);border-radius:var(--wob2);padding:3px}
.seg button{font:400 16px var(--f-display);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.dyn-card,.set-card,.mk-head{background:#fff;border:var(--pen);border-radius:var(--wob);box-shadow:4px 4px 0 var(--ink)}
.dyn-card h3{font:400 24px var(--f-display);color:var(--ink);text-decoration:underline wavy var(--gem) 2px;text-underline-offset:5px}
.stat{background:#fffdf6;border:2px dashed var(--ink);border-radius:var(--wob2)}
.stat span{font:400 13px var(--f-body);letter-spacing:.04em;color:var(--muted)}
.stat b{font:400 20px var(--f-display);color:var(--ink)}
.wide-btn{font:400 19px var(--f-display);color:var(--ink);background:var(--gem);border:var(--pen);border-radius:var(--wob2);box-shadow:3px 4px 0 var(--ink)}
.wide-btn:disabled{background:#f4f0e4;color:#9aa1ae;border:2.5px dashed #b6bcc8;box-shadow:none}
.wide-btn.warn{background:var(--coral);color:var(--ink);box-shadow:3px 4px 0 var(--ink)}
.ach{background:#fff;border:2px solid var(--ink);border-radius:var(--wob)}
.ach.done{box-shadow:3px 3px 0 var(--gem)}
.ach .ai{background:#fff;border:2px solid var(--ink);color:var(--muted);font:400 15px var(--f-display)}
.ach.done .ai{background:var(--gem);color:var(--ink)}
.ach b{font:400 16px var(--f-display);color:var(--ink)} .ach:not(.done) b{color:var(--muted)}
.ach span{font:400 13px var(--f-body)}
.row{background:#fff;border:2px solid var(--ink);border-radius:var(--wob2);box-shadow:2px 3px 0 var(--ink)}
.row.me{outline:0;background:#fff7cf;box-shadow:3px 3px 0 var(--coral)}
.rank{font:400 22px var(--f-display);color:var(--muted)}
.row:nth-child(1) .rank{color:#e0a200} .row:nth-child(2) .rank{color:#7d8898} .row:nth-child(3) .rank{color:#c46a3a}
.who{font:400 18px var(--f-display)} .who small{font:400 13px var(--f-body)}
.score{font:400 19px var(--f-display);color:var(--ink);background:linear-gradient(transparent 55%,var(--gold) 55% 90%,transparent 90%)}
.empty{background:#fff;border:2px dashed var(--ink);border-radius:var(--wob);font:400 16px var(--f-body)}
#intro{background:rgba(251,246,233,.9)}
#intro h1{font:400 clamp(44px,13vw,92px)/.95 var(--f-title);color:var(--coral);text-shadow:none;transform:rotate(-3deg)}
#intro h1 em{font:400 .36em var(--f-display);color:var(--ink);letter-spacing:.06em;text-shadow:none;background:linear-gradient(transparent 55%,var(--gold) 55% 90%,transparent 90%);display:inline-block;margin-bottom:6px}
#intro p{font:400 18px var(--f-body);color:var(--ink)}
.steps span{font:400 15px var(--f-display);letter-spacing:.02em;text-transform:none;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:var(--wob2);box-shadow:2px 2px 0 var(--ink)}
.steps span:nth-child(odd){transform:rotate(-2deg)} .steps span:nth-child(even){transform:rotate(2deg)}
#play{font:400 26px var(--f-display);color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:var(--wob2);box-shadow:4px 5px 0 var(--ink)}
.field label{font:400 16px var(--f-display);letter-spacing:.02em;text-transform:none;color:var(--ink)}
.txt{font:400 20px var(--f-body);color:var(--ink);background:#fff;border:var(--pen);border-radius:var(--wob2);box-shadow:3px 3px 0 var(--ink)}
.txt:focus{border-color:var(--ink);box-shadow:3px 3px 0 var(--coral)}
.txt::placeholder{color:#a3a9b5}
.sugs button{font:400 15px var(--f-body);color:var(--ink);background:#fff;border:2px dashed var(--ink);border-radius:var(--wob)}
.ghost{font:400 17px var(--f-display);color:var(--ink);background:var(--gem);border:var(--pen);border-radius:var(--wob2);box-shadow:2px 3px 0 var(--ink)}
.danger{font:400 17px var(--f-display);color:var(--coral);border:2.5px solid var(--coral);border-radius:var(--wob2);background:#fff}
.danger.armed{background:var(--coral);color:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
/* casino doodle */
.marquee{background:#fff;box-shadow:5px 6px 0 var(--ink);border:3px solid var(--ink);border-radius:var(--wob)}
.marquee::before,.marquee::after{background:radial-gradient(circle,var(--gold) 0 2.6px,var(--ink) 2.8px 3.8px,transparent 4px) 0 50%/16px 9px repeat-x;filter:none;height:9px}
.marquee .sign{font:400 clamp(30px,9vw,42px)/1 var(--f-title);background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--coral);filter:none;transform:rotate(-2deg)}
.marquee .tag{font:400 16px var(--f-display);letter-spacing:.06em;text-transform:none;color:var(--muted)}
.purse div{background:#fffdf6;border:2px dashed var(--ink);border-radius:var(--wob2)}
.purse span{font:400 13px var(--f-body);letter-spacing:.04em;text-transform:none;color:var(--muted)}
.purse b{font:400 22px var(--f-display);color:var(--ink)}
.felt{background:#e9fbef repeating-linear-gradient(-45deg,rgba(47,179,122,.18) 0 2px,transparent 2px 10px);border:3px solid var(--ink);border-radius:var(--wob);box-shadow:5px 6px 0 var(--ink)}
.felt:nth-of-type(odd){border-radius:var(--wob2)}
.felt::before{border:2px dashed rgba(31,42,68,.3);border-radius:var(--wob2)}
.plaque{font:400 22px var(--f-display);letter-spacing:.04em;color:var(--ink);background:var(--gold);border:var(--pen);border-radius:var(--wob2);box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.odds{font:400 15px var(--f-body);color:var(--ink)}
.wheel-wrap{filter:drop-shadow(5px 6px 0 rgba(31,42,68,.9))}
.wheel-wrap::after{border-top-color:var(--coral);filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(1.5px 1.5px 0 var(--ink))}
.hist span{font:400 13px var(--f-display);border:2px solid var(--ink);box-shadow:none}
.hist span:first-child{box-shadow:0 0 0 3px var(--gold)}
.hist .red{background:var(--coral)} .hist .blk{background:var(--ink)} .hist .grn{background:var(--mint)}
.hist em{font:400 15px var(--f-body);color:var(--muted)}
.cell{border:var(--pen);border-radius:var(--wob2);background:#fff;color:var(--ink);font:400 17px var(--f-display);text-transform:none;letter-spacing:.02em;box-shadow:2px 3px 0 var(--ink)}
.cell i{border:2px solid var(--ink);box-shadow:none}
.cell.zero i{color:#fff;font:400 14px var(--f-display)}
.cell b{font:400 15px var(--f-display);color:var(--coral)}
.cell[aria-pressed="true"]{background:var(--gold);border-color:var(--ink);box-shadow:3px 4px 0 var(--ink)}
.cell[aria-pressed="true"]::after{border:2px solid var(--ink)}
.stake{font:400 16px var(--f-body);color:var(--ink);text-transform:none;letter-spacing:0}
.stake b{font:400 26px var(--f-display);color:var(--ink);background:linear-gradient(transparent 55%,var(--gold) 55% 90%,transparent 90%)}
.stake small{font:400 14px var(--f-body);color:var(--muted)}

function fresh(){ return {coins:0, lifetime:0, run:0, up:{val:0,rain:0,mag:0,drone:0,turbo:0,luck:0,combo:0}, b:[0,0,0,0,0,0],

const toonGrad = (()=>{ const t = new THREE.DataTexture(new Uint8Array([110,190,255]), 3, 1, THREE.LuminanceFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
const toonCache = new Map();
function toonOf(m){
  if(!m || m.isMeshToonMaterial || m.isMeshBasicMaterial || m.isShaderMaterial) return m;
  if(toonCache.has(m)) return toonCache.get(m);
  const t = new THREE.MeshToonMaterial({color:m.color, map:m.map||null, gradientMap:toonGrad, emissive:m.emissive||new THREE.Color(0), emissiveMap:m.emissiveMap||null,
    emissiveIntensity:(m.emissiveIntensity===undefined?1:m.emissiveIntensity)*.8, side:m.side, transparent:m.transparent, opacity:m.opacity, alphaTest:m.alphaTest||0});
  toonCache.set(m, t); return t;
}
const outlineMats = {};
function outlineMat(th){
  const k = th.toFixed(3); if(outlineMats[k]) return outlineMats[k];
  const m = new THREE.MeshBasicMaterial({color:INK, side:THREE.BackSide});
  m.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `vec3 transformed = position + normalize(normal) * ${k};`); };
  m.customProgramCacheKey = () => 'ink'+k;
  return outlineMats[k] = m;
}
function doodlify(root){
  root.traverse(o => {
    if(!o.isMesh || o.isInstancedMesh || o.userData.isOutline) return;
    o.material = Array.isArray(o.material) ? o.material.map(toonOf) : toonOf(o.material);

    if(!Array.isArray(o.material) && o.material.isMeshBasicMaterial) return;
    if(!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
    const th = Math.min(.05, Math.max(.014, o.geometry.boundingSphere.radius*.07));
    const ol = new THREE.Mesh(o.geometry, outlineMat(th)); ol.userData.isOutline = true; ol.raycast = () => {}; o.add(ol);
  });
}
{ const _add = scene.add.bind(scene); scene.add = (...objs) => { objs.forEach(o => { if(o && o.isObject3D) doodlify(o); }); return _add(...objs); }; }

      if(k >= 1){ ballR = .69; ballA = -Math.PI/2; }

  wrap.appendChild(t2);

  coin.style.transform = `rotateY(${(flipHist[0]||0)*180}deg)`;
  const drawFH = () => { fh.innerHTML = flipHist.length ? flipHist.map(r=>`<span class="${r?'blk':'red'}" style="background:${r?'#3a8fbf':'#d99a1e'}">${r?'◆':'₵'}</span>`).join('') : '<em>Aún no hay lanzamientos</em>'; };
  drawFH();

  const st2 = stakeEl(); t2.appendChild(st2); t2.appendChild(chipRow(()=>refreshUI()));

  go2.addEventListener('click', () => {
    const bet = betAmount(casFrac); if(flipping || bet < 1) return; audio();
    const all = casFrac >= 1, pick = casSide; S.coins -= bet; flipping = true; refreshUI();
    const r = Math.random() < .5 ? 0 : 1;
    const from = (flipHist[0]||0)*180, turns = 7*360 + (r ? 180 : 0) - from % 360;
    const opts = {duration:1700, easing:'cubic-bezier(.25,.1,.25,1)', fill:'forwards'};
    coin.animate([{transform:`translateY(0) rotateY(${from}deg) rotateX(0deg)`},{transform:`translateY(-120px) rotateY(${from+turns*.55}deg) rotateX(14deg)`, offset:.45},{transform:`translateY(0) rotateY(${from+turns}deg) rotateX(0deg)`}], opts);

const BOTS = [

function botPrice(b, t=Date.now()){ const s=t/1000; return b.base*Math.exp(.45*Math.sin(s/b.p[0]*6.283) + .22*Math.sin(s/b.p[1]*6.283+1.3) + .08*Math.sin(s/b.p[2]*6.283+2.1)); }
const playerPrice = d => Math.max(0.1, (d.ips||0)*0.6);
function marketList(){
  const out = BOTS.map(b => ({id:b.id, name:b.name, bot:true, price:botPrice(b)}));
  (board||[]).forEach(d => { if(d.id !== uid) out.push({id:d.id, name:cleanName(d.name)||'Imperio sin nombre', owner:names[d.id], bot:false, price:playerPrice(d), dyn:d.dyn||0}); });
  Object.keys(S.inv).forEach(id => { if(!out.some(o=>o.id===id)) out.push({id, name:S.inv[id].name||'Imperio', gone:true, price:0}); });
  return out;
}
const priceHist = {};
function samplePrices(){ marketList().forEach(m => { const h = priceHist[m.id] = priceHist[m.id] || []; h.push(m.price); if(h.length > 40) h.shift(); }); }
function spark(h){
  if(!h || h.length < 2) return '<svg viewBox="0 0 100 34" preserveAspectRatio="none"></svg>';
  const lo = Math.min(...h), hi = Math.max(...h), rg = (hi-lo) || hi*.01 || 1;
  const pts = h.map((v,i)=>`${(i/(h.length-1)*100).toFixed(1)},${(30-(v-lo)/rg*26).toFixed(1)}`).join(' ');
  const up = h[h.length-1] >= h[0]; const c = up ? 'var(--mint)' : 'var(--coral)';
  return `<svg viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,34 ${pts} 100,34" fill="${up?'rgba(95,211,166,.12)':'rgba(255,138,107,.12)'}" stroke="none"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
let mktFrac = .25;
function invest(m){
  const amt = m.bot || !m.gone ? (mktFrac>=1 ? Math.floor(S.coins) : Math.floor(S.coins*mktFrac)) : 0;
  if(amt < 1 || m.price <= 0) return; audio();
  const h = S.inv[m.id] = S.inv[m.id] || {sh:0, cost:0, name:m.name};
  h.sh += amt/m.price; h.cost += amt; h.name = m.name; S.coins -= amt; S.st.invests++; cloudDirty = true;
  chime(); thump(); toast(`Invertiste <b>${fmt(amt)}</b> en ${escapeHtml(m.name)}`); refreshUI();
}
function sellAll(m){
  const h = S.inv[m.id]; if(!h) return; audio();
  const value = h.sh * m.price, profit = value - h.cost;
  S.coins += value; if(profit > 0){ S.lifetime += profit; S.run += profit; }
  if(value >= h.cost*2) S.st.bestTrade = 1;
  delete S.inv[m.id]; cloudDirty = true;
  if(profit >= 0){ fanfare(); burst(new THREE.Vector3(0,1,0), 50, 'mint', 1.3); toast(`Vendiste por <b>${fmt(value)}</b> · ganancia ${fmt(profit)}`); }
  else { casinoLose(); toast(`Vendiste por <b>${fmt(value)}</b> · pérdida ${fmt(-profit)}`); }
  render();
}

// ================= RESIZE =================
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if(!w||!h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  camDist = Math.max(13, (ISL_R+1.2) / (half*Math.min(camera.aspect, 1.25)) * 0.95);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// ================= LOOP =================
let sampT=0, spawnT=0, ambT=0, rainT=70+Math.random()*50, uiT=0, saveT=0, achT=0, stormT=0, last=performance.now(), time=0;
function frame(t){
  const dt = Math.min(0.05, (t-last)/1000); last = t; time += dt;
  if(playing){
    earn(passive()*dt);
    spawnT += dt; const every = spawnEvery() / (frenzy()>1 ? 2 : 1);
    while(spawnT > every){ spawnT -= every; spawnCoin(); }
    if(stormQueue > 0){ stormT += dt; while(stormT > .1 && stormQueue > 0){ stormT -= .1; stormQueue--; spawnCoin(); } }
    rainT -= dt; if(rainT <= 0){ rainT = 80+Math.random()*60; toast('<b>¡Lluvia dorada!</b>'); for(let i=0;i<30;i++) spawnCoin(undefined, undefined, 7+i*0.25, i===0); }
    chestT -= dt; if(chestT <= 0 && !chest){ chestT = chestEvery()*(0.8+Math.random()*.4); spawnChest(); }
  } else { spawnT += dt; if(spawnT > .5){ spawnT = 0; spawnCoin(); } }
  // coins
  for(let i=coins.length-1;i>=0;i--){
    const c = coins[i], p = c.m.position; c.life += dt;
    if(!c.landed){ c.vy -= 18*dt; p.y += c.vy*dt; p.x += c.vx*dt; p.z += c.vz*dt;
      if(p.y < .06){ p.y = .06; if(Math.abs(c.vy) > 2){ c.vy = -c.vy*0.38; if(c.vy > 3 && playing && now()-lastBlip > 60){ tone(2400+Math.random()*600,.03,.012,'sine'); lastBlip=now(); } } else { c.vy=0; c.landed=true; } c.vx*=.6; c.vz*=.6; }
      c.m.rotation.z += c.spin*dt; c.m.rotation.x += c.spin*dt*0.3;
    } else { c.m.rotation.x += (0 - c.m.rotation.x)*Math.min(1, dt*6); c.m.rotation.z += dt*1.4; p.y = .07 + Math.abs(Math.sin(time*3 + c.ph))*0.07; }
    if(c.gem && Math.random() < dt*6) rising(p, 'gem');
    if(c.life > 24){ c.m.visible = Math.floor(c.life*8)%2===0; }
    if(c.life > 28) removeCoin(c);
  }
  // drones
  const sp = droneSpeed(), storming = now() < stormUntil;
  drones.forEach((d, k) => {
    if(d.target && !coins.includes(d.target)) d.target = null;
    if(!d.target){ let best=null, bd=1e9; for(const c of coins){ if(c.claimed && c.claimed!==d) continue; if(c.m.position.y > 3) continue; const dd = d.m.position.distanceTo(c.m.position); if(dd<bd){ bd=dd; best=c; } }
      if(best){ d.target = best; best.claimed = d; } }
    if(d.target){ const tp = d.target.m.position; const dir = v3.set(tp.x - d.m.position.x, tp.y + 0.35 - d.m.position.y, tp.z - d.m.position.z);
      const L = dir.length(); if(L < 0.35){ collect(d.target, false); d.target=null; } else d.m.position.addScaledVector(dir.normalize(), Math.min(L, sp*dt));
      d.trail += dt; if(d.trail > (storming ? .03 : .08)){ d.trail = 0; tv.set(0,0,0); emit(d.m.position, tv, .35, storming ? PAL.coral : PAL.mint, 0); pMesh.instanceColor.needsUpdate = true; } }
    else { d.phase += dt*0.6; const tx=Math.cos(d.phase+k)*2.4, tz=Math.sin(d.phase+k)*2.4; d.m.position.x += (tx-d.m.position.x)*dt*1.5; d.m.position.z += (tz-d.m.position.z)*dt*1.5; d.m.position.y += (2.4+Math.sin(time*2+k)*.2 - d.m.position.y)*dt*2; }
    d.m.rotation.y += dt*(storming?12:4);
  });
  // chest
  if(chest){
    const c = chest, g = c.g; c.life += dt;
    if(g.position.y > 0){ c.vy -= 14*dt; g.position.y = Math.max(0, g.position.y + c.vy*dt); if(g.position.y === 0){ burst(g.position.clone().setY(.1), 20, 'gold', .7); thump(); shake = Math.max(shake,.3); } }
    g.scale.setScalar(1 + (g.scale.x - 1)*Math.pow(.001, dt));
    c.glow.intensity = 1 + Math.sin(time*5)*.5;
    if(c.open < 0){ c.lid.rotation.x = -Math.abs(Math.sin(time*8))*0.06*c.hits; if(Math.random() < dt*8) rising(g.position.clone().setY(.6)); }
    else { c.open += dt; c.lid.rotation.x = -Math.min(1.9, c.open*6); if(c.open < .8 && Math.random()<.6) rising(g.position.clone().setY(.7), Math.random()<.3?'gem':'gold');
      if(c.open > 2.2){ g.scale.setScalar(Math.max(.01, 1-(c.open-2.2)*3)); } if(c.open > 2.6){ scene.remove(g); chest = null; } }
    if(chest && c.open < 0 && c.life > 30){ scene.remove(g); chest = null; }
  }
  // buildings
  placed.forEach(p => { if(p.grow < 1){ p.grow = Math.min(1, p.grow + dt*2.2); const t=p.grow, e = 1 + 2.2*Math.pow(t-1,3) + 1.2*Math.pow(t-1,2); p.g.scale.setScalar(Math.max(.01,e)*.85); }
    const u = p.g.userData;
    if(u.spin) u.spin.rotation.y += dt*2.5; if(u.glow) u.glow.material.emissiveIntensity = 1 + Math.sin(time*3)*.5;
    if(u.blink) u.blink.visible = Math.sin(time*4 + p.g.position.x) > -0.3;
    if(u.ticker) u.ticker.material.map.offset.x = (u.ticker.material.map.offset.x + dt*.25) % 1;
    if(u.flags) u.flags.forEach((f,i)=>{ f.rotation.y = Math.sin(time*5 + i*2)*.5; });
    if(u.lamp) u.lamp.material.emissiveIntensity = 1.6 + Math.sin(time*7 + p.g.position.z)*.4;
    if(u.dome) u.dome.rotation.y += dt*.3;
    if(u.aura){ u.aura.material.opacity = .45 + Math.sin(time*3)*.25; }
    if(u.crown){ u.crown.rotation.y += dt*1.2; u.crown.position.y += Math.sin(time*2 + p.g.position.x)*.002; }
    if(u.sparkle && p.grow >= 1 && Math.random() < dt*3){ const a=Math.random()*6.28; tv.set(Math.cos(a)*.7, .2+Math.random()*1.5, Math.sin(a)*.7); const w = p.g.localToWorld(tv.clone()); tv.set(0,.4,0); emit(w, tv, 1, PAL.gold, 0); pMesh.instanceColor.needsUpdate = true; }
    if(u.smoke2 && p.grow >= 1 && Math.random() < dt*4){ const w = p.g.localToWorld(u.smoke2.clone()); tv.set((Math.random()-.5)*.2, .5, (Math.random()-.5)*.2); emit(w, tv, 1.5, PAL.smoke, -0.15); pMesh.instanceColor.needsUpdate = true; }
    if(u.ring) u.ring.rotation.z += dt*1.5; if(u.moon) u.moon.position.set(Math.cos(time)*.75, 1.2 + Math.sin(time*2)*.1, Math.sin(time)*.75);
    if(u.smoke && p.grow >= 1 && Math.random() < dt*5){ const w = p.g.localToWorld(u.smoke.clone()); tv.set((Math.random()-.5)*.2, .5+Math.random()*.3, (Math.random()-.5)*.2); emit(w, tv, 1.6, PAL.smoke, -0.15); pMesh.instanceColor.needsUpdate = true; } });
  ambT -= dt; if(ambT <= 0 && placed.length){ ambT = Math.max(0.12, 1.2/Math.sqrt(placed.length)); const p = placed[Math.floor(Math.random()*placed.length)]; rising(tv.set(p.g.position.x, 1.2, p.g.position.z).clone()); }
  // villagers
  villagers.forEach(v => { v.a += v.dir*v.sp*dt/v.r; if(Math.random() < dt*.05) v.dir *= -1;
    v.g.position.set(Math.cos(v.a)*v.r, Math.abs(Math.sin(time*9+v.ph))*.025, Math.sin(v.a)*v.r); v.g.rotation.y = -v.a + (v.dir>0 ? Math.PI : 0); });
  // lanterns
  const lit = Math.min(24, Math.floor(Math.log10(S.lifetime+1)*2));
  lanterns.forEach((l,i) => { const want = toonOf(i < lit ? lanternOn : lanternOff); if(l.material !== want) l.material = want; });
  clouds.forEach(c => { c.userData.a += dt*c.userData.sp; c.position.set(Math.cos(c.userData.a)*c.userData.r, c.userData.y + Math.sin(time*.5 + c.userData.r)*.2, Math.sin(c.userData.a)*c.userData.r); });
  minis.forEach((m,i) => { m.position.y = m.userData.y + Math.sin(time*.6 + m.userData.ph)*.3; m.userData.c.rotation.z += dt; m.rotation.y += dt*.05; });
  // particles
  for(let i=0;i<PN;i++){ const p=parts[i];
    if(p.life > 0){ p.life -= dt; p.v.y -= p.g*dt; p.p.addScaledVector(p.v, dt); dummy.position.copy(p.p); dummy.rotation.set(time*5+i, time*3, 0); dummy.scale.setScalar(Math.max(0, Math.min(1, p.life*2))); }
    else dummy.scale.setScalar(0);
    dummy.updateMatrix(); pMesh.setMatrixAt(i, dummy.matrix); }
  pMesh.instanceMatrix.needsUpdate = true;
  // combo
  if(now() - lastTap > 1300) combo = 0;
  const cb = $('#combo'); const on = combo >= 3; cb.classList.toggle('on', on); if(on) cb.textContent = 'combo ×'+comboMult().toFixed(2);
  frenzyL.intensity = now() < frenzyUntil ? 1.5 + Math.sin(time*8)*.5 : 0;
  // camera
  yaw += dt * (playing ? 0.03 : 0.15);
  shake *= Math.pow(0.02, dt);
  const d = camDist * zoom * (playing ? 1 : 0.85);
  camera.position.set(Math.sin(yaw)*d*0.6, d*0.8, Math.cos(yaw)*d*0.6);
  camera.position.x += (Math.random()-.5)*shake*.4; camera.position.y += (Math.random()-.5)*shake*.4;
  camera.lookAt(0, playing ? 0.4 : 1.2, 0);
  renderer.render(scene, camera);
  // ui + save
  uiT += dt; if(uiT > 0.2){ uiT = 0; refreshUI(); }
  achT += dt; if(achT > 1 && playing){ achT = 0; checkAch(); }
  sampT += dt; if(sampT > 3){ sampT = 0; samplePrices(); }
  saveT += dt; if(saveT > 5 && playing){ saveT = 0; saveNow(false); }
  requestAnimationFrame(frame);
}

// ================= BOOT =================
const SUGS = ['Reino del Doblón','Dinastía Dorada','Imperio Áureo','Bóveda del Norte','Casa de la Fortuna','República del Peso'];
function showIntro(){
  const has = !!S.name;
  $('#intro').hidden = false; $('#nameField').hidden = has;
  if(has){ $('#play').textContent = 'Continuar'; $('#introTxt').textContent = `${S.name} · Dinastía #${S.dyn+1} · patrimonio ${fmt(S.lifetime)}. Tu imperio te espera.`; $('#play').disabled = false; }
  else { $('#play').textContent = 'Fundar imperio'; $('#introTxt').textContent = 'Recoge monedas, pon a trabajar a tus drones y levanta un imperio que crece incluso cuando no juegas.';
    const inp = $('#empName'); inp.value = ''; $('#play').disabled = true;
    const sg = $('#sugs'); sg.innerHTML = ''; SUGS.slice().sort(()=>Math.random()-.5).slice(0,3).forEach(n => { const b=document.createElement('button'); b.type='button'; b.textContent=n; b.addEventListener('click', ()=>{ inp.value=n; $('#play').disabled=false; inp.focus(); }); sg.appendChild(b); }); }
}
function begin(){
  if(playing) return;
  if(!S.name){ const v = cleanName($('#empName').value); if(!v){ $('#empName').focus(); return; } S.name = v; nameDirty = true; }
  updateName();
  playing = true; audio(); chime();
  $('#intro').hidden = true; refreshUI();
  if(S.lifetime < 1) setTimeout(()=>toast(`Bienvenido a <b>${escapeHtml(S.name)}</b>`), 100);
  if(S.day !== today()){
    const first = !S.day; S.day = today(); S.st.dailies++;
    const g = Math.max(100, passive()*300, coinValue()*60); earn(g);
    setTimeout(()=>toast(first ? `Bono de bienvenida: <b>+${fmt(g)}</b>` : `Bono diario: <b>+${fmt(g)}</b>`), 300);
  }
  if(offlineGain > 0) setTimeout(()=>toast(`Mientras no estabas, tu imperio ganó <b>${fmt(offlineGain)}</b>`), 1400);
  for(let i=0;i<14;i++) spawnCoin(undefined, undefined, 3+Math.random()*7);
  saveNow(true);
}
let offlineGain = 0;
function start(hot){
  const saved = (hot && hot.S) || lsGet();
  if(saved) S = hydrate(saved);
  if(!hot || !hot.S){
    const cap = (2 + 2*S.relic.pat)*3600, rate = S.relic.pat ? 1 : .5;
    const away = Math.min(cap, Math.max(0, (Date.now() - (S.t||Date.now()))/1000));
    const g = passive()*away*rate;
    if(g >= 1 && away > 30){ earn(g); offlineGain = g; }
  }
  if(!S.name && S.lifetime > 0) S.name = '';
  showIntro(); updateName();
  $('#empName').addEventListener('input', e => { $('#play').disabled = !cleanName(e.target.value); });
  $('#empName').addEventListener('keydown', e => { if(e.key==='Enter') begin(); });
  if(S.lifetime > 200) $('#hint').style.opacity = 0;
  syncBuildings(false); syncDrones(); resize(); render();
  $('#play').addEventListener('click', begin);
  window.claude?.hot?.snapshot?.(() => ({S}));
  if(hot && hot.S && S.name) begin();
  requestAnimationFrame(t => { last=t; frame(t); });
  setTimeout(initCloud, 0);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
